name: client tests

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.14"]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Look up a name in the live index
        run: |
          pip install .
          py-code who-uses requests.Session --limit 3
