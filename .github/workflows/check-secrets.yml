name: check-secrets
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets are set and valid
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF: ${{ secrets.HF_TOKEN }}
        run: |
          echo "CF length ${#CF}, HF length ${#HF}"
          curl -s -H "Authorization: Bearer $CF" https://api.cloudflare.com/client/v4/accounts/0c6221c26bb36b355c55b6e80e958665/tokens/verify | jq -c '{success, status: .result.status}'
          curl -s -H "Authorization: Bearer $HF" https://huggingface.co/api/whoami-v2 | jq -c '{name, type: .auth.type, token: .auth.accessToken.displayName}'
